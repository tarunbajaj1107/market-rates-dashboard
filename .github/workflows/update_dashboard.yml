name: Update Market Rates Dashboard

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  repository_dispatch:
    types: [run_scraper] # Allows external trigger via API / dashboard button

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permits pushing updated index.html back to main branch

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fix System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install Python Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Scraper Script
        run: python generate_dashboard.py

      - name: Commit & Push Updated index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          git add index.html
          git commit -m "Automated dashboard update [skip ci]" || exit 0
          git push
