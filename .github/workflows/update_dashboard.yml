name: Update Market Rates Dashboard

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow from GitHub UI anytime

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to commit and push index.html back to main branch

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Scraper Script
        run: python generate_dashboard.py

      - name: Commit & Push Updated index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automated dashboard update [skip ci]" || exit 0
          git push
