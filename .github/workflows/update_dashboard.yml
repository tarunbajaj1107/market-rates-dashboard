name: Update Market Rates Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Grant write permissions to push index.html back to the repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade playwright
          python -m playwright install --with-deps chromium

      - name: Run Scraper Script
        run: python generate_dashboard.py

      - name: Commit and Push Updated Dashboard
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          git commit -m "Auto-update market rates [skip ci]" || echo "No changes to commit"
          git push
